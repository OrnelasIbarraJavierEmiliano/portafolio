<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <style>
    body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;background:#0f172a;color:#fff}
    .card{background:rgba(255,255,255,0.05);padding:24px;border-radius:12px;width:300px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
    h2{text-align:center;margin:0 0 20px}
    label{font-size:14px;display:block;margin:10px 0 4px}
    input{width:100%;padding:10px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:transparent;color:#fff;outline:none}
    .btn{width:100%;margin-top:16px;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-weight:bold;cursor:pointer}
    .btn:active{transform:scale(.98)}
    .muted{text-align:center;font-size:13px;margin-top:12px;color:rgba(255,255,255,.7)}
  </style>
</head>
<body>
  <div class="card">
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <label for="user">Usuario</label>
      <input id="user" name="user" type="text" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required minlength="6">
      <button class="btn" type="submit">Entrar</button>
    </form>
    <p class="muted">¿No tienes cuenta? <a href="#" style="color:inherit">Regístrate</a></p>
  </div>

  <script>
    const form=document.getElementById('loginForm');
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const user=form.user.value.trim(),pwd=form.password.value;
      if(!user||pwd.length<6){alert('Datos inválidos');return;}
      alert('Formulario válido (demo)');
      form.reset();
    });
  </script>
</body>
</html>
